name: Deploy app to Xserver

# main にアプリのファイルが push されたら、エックスサーバーの /app/ へ自動転送する。
# 接続情報は GitHub Secrets（XSERVER_FTP_HOST / XSERVER_FTP_USER /
# XSERVER_FTP_PASSWORD / XSERVER_REMOTE_DIR）に登録する。
# Secrets が未登録のあいだは何もせず正常終了する。

on:
  push:
    branches: [main]
    paths:
      - index.html
      - sw.js
      - manifest.webmanifest
      - icon-192.png
      - icon-512.png
      - apple-touch-icon.png
      - shot-gacha.png
      - shot-lunch.png
      - shot-week.png
      - .htaccess
  workflow_dispatch:

# アプリ転送と同時に走ると、サーバー側のFTP同時接続制限に当たって失敗するため直列化する
concurrency:
  group: xserver-ftp
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check FTP secrets
        id: check
        env:
          HOST: ${{ secrets.XSERVER_FTP_HOST }}
        run: echo "configured=$([ -n "$HOST" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Stage app files
        if: steps.check.outputs.configured == 'true'
        run: |
          mkdir out
          cp index.html sw.js manifest.webmanifest icon-192.png icon-512.png apple-touch-icon.png \
             shot-gacha.png shot-lunch.png shot-week.png .htaccess out/

      - name: Upload via FTPS (lftp, 5 retries)
        timeout-minutes: 8
        if: steps.check.outputs.configured == 'true'
        env:
          H: ${{ secrets.XSERVER_FTP_HOST }}
          U: ${{ secrets.XSERVER_FTP_USER }}
          P: ${{ secrets.XSERVER_FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          for i in 1 2 3 4 5; do
            if lftp -u "$U","$P" -e "set ftp:ssl-force true; set ftp:passive-mode true; set net:timeout 15; set net:max-retries 1; set net:reconnect-interval-base 5; set net:connection-limit 1; set mirror:parallel-transfer-count 1;               mirror -R --verbose out/ /run-digital.com/public_html/uchimenu.run-digital.com/app/;               put -O /run-digital.com/public_html/uchimenu.run-digital.com/app/ out/.htaccess;               bye" "$H"; then
              echo "upload ok"; exit 0
            fi
            echo "attempt $i failed, waiting..."; sleep 15
          done
          echo "upload failed after 5 attempts"; exit 1

      - name: Skip note
        if: steps.check.outputs.configured != 'true'
        run: echo "FTP secrets are not set yet - skipping deploy."
