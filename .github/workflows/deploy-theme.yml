name: Deploy WP theme to Xserver

# wp-theme/ 配下が main に push されたら、WordPress のテーマディレクトリへ自動転送する。
# 接続情報はアプリ転送と同じ Secrets を使う。

on:
  push:
    branches: [main]
    paths:
      - "wp-theme/**"
  workflow_dispatch:

# アプリ転送と同時に走ると、サーバー側のFTP同時接続制限に当たって失敗するため直列化する
concurrency:
  group: xserver-ftp
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check FTP secrets
        id: check
        env:
          HOST: ${{ secrets.XSERVER_FTP_HOST }}
        run: echo "configured=$([ -n "$HOST" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Upload via FTPS (lftp, 5 retries)
        if: steps.check.outputs.configured == 'true'
        env:
          H: ${{ secrets.XSERVER_FTP_HOST }}
          U: ${{ secrets.XSERVER_FTP_USER }}
          P: ${{ secrets.XSERVER_FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          for i in 1 2 3 4 5; do
            if lftp -u "$U","$P" -e "set ftp:ssl-force true; set ftp:passive-mode true; set net:timeout 30; set net:max-retries 3; set net:reconnect-interval-base 8; set net:connection-limit 1; set mirror:parallel-transfer-count 1;               mirror -R --verbose wp-theme/uchimenu/ /run-digital.com/public_html/uchimenu.run-digital.com/wp-content/themes/uchimenu/; bye" "$H"; then
              echo "upload ok"; exit 0
            fi
            echo "attempt $i failed, waiting..."; sleep $((i*20))
          done
          echo "upload failed after 5 attempts"; exit 1

      - name: Skip note
        if: steps.check.outputs.configured != 'true'
        run: echo "FTP secrets are not set yet - skipping deploy."
