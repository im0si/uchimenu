name: Xserver maintenance

# 手動実行専用。task=list でフォルダ確認、task=cleanup で
# 誤配置フォルダ（/run-digital.com/public_html/uchimenu）の削除＋確認を行う。

on:
  workflow_dispatch:
    inputs:
      task:
        description: "list または cleanup"
        required: true
        default: "list"

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Run task
        env:
          H: ${{ secrets.XSERVER_FTP_HOST }}
          U: ${{ secrets.XSERVER_FTP_USER }}
          P: ${{ secrets.XSERVER_FTP_PASSWORD }}
          TASK: ${{ inputs.task }}
        run: |
          if [ "$TASK" = "cleanup" ]; then
            lftp -u "$U","$P" -e "set ftp:ssl-force true; rm -rf /run-digital.com/public_html/uchimenu; bye" "$H" && echo "stray folder removed"
          fi
          echo "===== uchimenu.run-digital.com/"
          lftp -u "$U","$P" -e "set ftp:ssl-force true; cls -la /run-digital.com/public_html/uchimenu.run-digital.com/; bye" "$H" || true
          echo "===== uchimenu.run-digital.com/app/"
          lftp -u "$U","$P" -e "set ftp:ssl-force true; cls -la /run-digital.com/public_html/uchimenu.run-digital.com/app/; bye" "$H" || true
          echo "===== stray folder (should fail after cleanup)"
          lftp -u "$U","$P" -e "set ftp:ssl-force true; cls -la /run-digital.com/public_html/uchimenu/; bye" "$H" || echo "OK: stray folder is gone"
