name: Post articles to WordPress

# 手動実行専用。articles/*.html を WordPress へ「下書き」として投稿する。
# 同じスラッグが既にある場合: 下書きなら内容を更新、公開済みならスキップ
#（公開後にWP側で加えた修正を上書きしないため）。
# 必要な Secrets: WP_APP_USER（WPユーザー名）/ WP_APP_PASS（アプリケーションパスワード）

on: workflow_dispatch

env:
  WP_BASE: https://uchimenu.run-digital.com

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Post drafts via REST API
        env:
          WP_USER: ${{ secrets.WP_APP_USER }}
          WP_PASS: ${{ secrets.WP_APP_PASS }}
        run: |
          python3 - <<'EOF'
          import os, re, json, glob, base64, urllib.request, urllib.parse

          BASE = os.environ["WP_BASE"].rstrip("/") + "/wp-json/wp/v2"
          auth = base64.b64encode(f'{os.environ["WP_USER"]}:{os.environ["WP_PASS"]}'.encode()).decode()

          def api(method, path, data=None):
              req = urllib.request.Request(BASE + path, method=method)
              req.add_header("Authorization", "Basic " + auth)
              body = None
              if data is not None:
                  body = json.dumps(data).encode()
                  req.add_header("Content-Type", "application/json")
              with urllib.request.urlopen(req, body, timeout=30) as r:
                  return json.loads(r.read().decode())

          def category_id(name):
              found = api("GET", "/categories?per_page=100&search=" + urllib.parse.quote(name))
              for c in found:
                  if c["name"] == name:
                      return c["id"]
              return api("POST", "/categories", {"name": name})["id"]

          posted = updated = skipped = 0
          for f in sorted(glob.glob("articles/*.html")):
              raw = open(f, encoding="utf-8").read()
              m = re.match(r"<!--meta\s+(\{.*?\})\s*-->\s*(.*)", raw, re.S)
              if not m:
                  print(f"SKIP(no meta): {f}"); continue
              meta = json.loads(m.group(1))
              payload = {
                  "title":      meta["title"],
                  "slug":       meta["slug"],
                  "content":    m.group(2),
                  "excerpt":    meta.get("excerpt", ""),
                  "categories": [category_id(meta["category"])],
              }
              existing = api("GET", "/posts?status=any&slug=" + meta["slug"])
              if existing:
                  if existing[0]["status"] == "draft":
                      api("POST", f"/posts/{existing[0]['id']}", payload)
                      print(f"UPDATED(draft): {meta['slug']}"); updated += 1
                  else:
                      print(f"SKIP(published): {meta['slug']}"); skipped += 1
                  continue
              payload["status"] = "draft"
              post = api("POST", "/posts", payload)
              print(f"POSTED(draft): {meta['slug']} -> id {post['id']}"); posted += 1

          print(f"done: posted {posted}, updated {updated}, skipped {skipped}")
          EOF
